{% set name = "python-liquid" %}
{% set version = "2.3.4" %}
{% set python_min = "3.9" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 0af358a253f9f249730deab8e31bca3bd69a9e4b2422f8fb27e25d33393f3b3a

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - pip
    - python {{ python_min }}
    - hatchling >=1.14
  run:
    - python >={{ python_min }}
    - python-dateutil >=2.8.1
    - babel >=2
    - pytz
    - markupsafe >=3
    - importlib-resources >=5.12.0

test:
  imports:
    - liquid
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://jg-rp.github.io/liquid/
  summary: A Python engine for the Liquid template language.
  license: MIT
  license_file:
    - LICENSE
  dev_url: https://github.com/jg-rp/liquid/

extra:
  recipe-maintainers:
    - jg-rp
