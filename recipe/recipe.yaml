schema_version: 1

context:
  version: 3.0.0
  python_min: "3.12"

package:
  name: python-liquid
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/python-liquid/python_liquid-${{ version }}.tar.gz
  sha256: 88b4b676e41f6ff6e92106c6ddf006370c6f1bfcc2d1f26f7380ea0a7e9da004

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - markupsafe >=3
    - python-dateutil
    - babel >=2
    - tzdata

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - liquid
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - pip check

about:
  summary: A Python engine for the Liquid template language.
  license: MIT
  license_file: LICENSE
  homepage: https://jg-rp.github.io/liquid/
  documentation: https://jg-rp.github.io/liquid/

extra:
  recipe-maintainers:
    - jg-rp
